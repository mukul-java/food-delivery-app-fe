<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="foodDashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#foodDashGradient)" />

  <!-- Food & Delivery Icon -->
  <g filter="url(#shadow)">
    <!-- Rising Steam Lines -->
    <path d="M 23 17 C 21 14 25 12 23 9" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95" />
    <path d="M 32 16 C 30 13 34 11 32 8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95" />
    <path d="M 41 17 C 39 14 43 12 41 9" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95" />

    <!-- Bowl Rim -->
    <rect x="13" y="25" width="38" height="5" rx="2.5" fill="#FFFFFF" />

    <!-- Bowl Body -->
    <path d="M 15 28 H 49 C 49 43 41 50 32 50 C 23 50 15 43 15 28 Z" fill="#FFFFFF" />

    <!-- Chef / Utensils accent cutout on bowl -->
    <path d="M 28 35 C 28 32 36 32 36 35 L 35 44 H 29 Z" fill="url(#foodDashGradient)" />
    <circle cx="32" cy="35" r="2.5" fill="#FFFFFF" />
  </g>
</svg>
